name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build hook and test runtime file security
        run: make test
      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile runtime.py gui.py
          bash -n launch.sh setspeed.sh watch.sh umagui

  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSYS2 with mingw-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-tools
            make

      - name: Build EXE and DLL
        run: |
          cd windows
          make CC=gcc WINDRES=windres

      - name: List artifacts
        run: |
          cd windows
          ls -lh uma_speed_trainer.exe uma_hook.dll

      - name: Upload Windows build
        uses: actions/upload-artifact@v5
        with:
          name: UmaSpeedTrainer-windows
          path: |
            windows/uma_speed_trainer.exe
            windows/uma_hook.dll
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v5
        with:
          name: UmaSpeedTrainer-windows
          path: windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/uma_speed_trainer.exe
            windows/uma_hook.dll
          generate_release_notes: false
          body: |
            ## UmaSpeedTrainer ${{ github.ref_name }}

            Windows build. See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for setup instructions.

            > Built automatically. Untested by the author. Claude wrote the Windows port.
